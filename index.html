<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tommy App</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tommy App">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f2ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<style>
:root{
  --bg:#f6f2ec; --card:#ffffff; --ink:#2a2521; --sub:#7b726a; --line:#e9e2d8;
  --comida:#d9704f; --comida-s:#fbe9e2;
  --sueno:#5865c4; --sueno-s:#e7e9fa;
  --panal:#2f9483; --panal-s:#ddf2ee;
  --nota:#9a74c2; --nota-s:#efe7f8;
  --ok:#2f9a5a; --warn:#d99a2b; --err:#c8463d;
  --comida-f:#d9704f; --sueno-f:#5865c4;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#131118; --card:#1f1c26; --ink:#efeaf4; --sub:#9c94a8; --line:#2e2a37;
    --comida:#f08b6a; --comida-s:#3a2620;
    --sueno:#8f9bff; --sueno-s:#262a4a;
    --panal:#4cc2ad; --panal-s:#1b3632;
    --nota:#bb98e6; --nota-s:#2e2440;
    --comida-f:#b9583a; --sueno-f:#4a54b3;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:12px;width:100%}
textarea{min-height:70px;resize:vertical}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin:22px 4px 10px;font-weight:600}

header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
header .titulo{flex:1;min-width:0}
header h1{margin:0;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{color:var(--sub);font-size:14px}
.estado{width:10px;height:10px;border-radius:50%;background:var(--sub)}
.estado.ok{background:var(--ok)} .estado.pend{background:var(--warn)} .estado.err{background:var(--err)}
.icono{width:42px;height:42px;border-radius:50%;background:var(--card);font-size:20px;display:grid;place-items:center}

main{padding:0 14px;max-width:560px;margin:0 auto}
.vista{display:none} .vista.activa{display:block}

/* Último de cada cosa */
.ultimos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.ult{background:var(--card);border-radius:14px;padding:10px 10px 9px}
.ult .k{font-size:12px;color:var(--sub)}
.ult .v{font-size:17px;font-weight:700;margin-top:2px}
.ult .d{font-size:12px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* En curso */
.curso{border-radius:var(--r);padding:16px;margin-top:12px;color:#fff;position:relative;overflow:hidden}
.curso.comida{background:var(--comida-f)} .curso.sueno{background:var(--sueno-f)}
.curso .que{font-size:15px;opacity:.92}
.curso .reloj{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:2px 0 12px}
.curso .acciones{display:flex;gap:8px;flex-wrap:wrap}
.curso .acciones button{background:rgba(255,255,255,.22);padding:12px 16px;border-radius:14px;font-weight:600}
.curso .acciones button.fuerte{background:#fff;color:#222;flex:1}
.curso .desde{position:absolute;top:16px;right:16px;font-size:13px;opacity:.85}

/* Botones grandes */
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:1fr 1fr 1fr}
.big{background:var(--card);border-radius:var(--r);padding:14px 10px;min-height:92px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:15px;position:relative;
  box-shadow:0 1px 0 var(--line);transition:transform .08s}
.big:active{transform:scale(.97)}
.big .em{font-size:30px;line-height:1}
.big small{font-weight:500;color:var(--sub);font-size:12px}
.big.comida{border:2px solid transparent} .big.comida.sug{border-color:var(--comida)}
.big .tag{position:absolute;top:7px;right:8px;font-size:10px;font-weight:700;background:var(--comida);color:#fff;
  padding:2px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.04em}
.big.sueno-b{background:var(--sueno-f);color:#fff;min-height:84px;flex-direction:row;gap:12px;font-size:18px}
.big.sueno-b small{color:rgba(255,255,255,.85)}
.big.panal{background:var(--panal-s)} .big.nota-b{background:var(--nota-s);min-height:56px;flex-direction:row;gap:8px}
.big[disabled]{opacity:.45}

/* Historial */
.dia{margin-top:18px}
.dia > .cab{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px}
.dia > .cab b{font-size:15px} .dia > .cab span{font-size:12px;color:var(--sub)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);padding:12px;border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.item .ic.comida{background:var(--comida-s)} .item .ic.sueno{background:var(--sueno-s)}
.item .ic.panal{background:var(--panal-s)} .item .ic.nota{background:var(--nota-s)}
.item .tx{flex:1;min-width:0}
.item .t1{font-weight:600} .item .t2{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .hr{font-variant-numeric:tabular-nums;font-size:14px;color:var(--sub);text-align:right;flex:none}
.item.vivo .hr{color:var(--sueno);font-weight:700}
.agregar{width:100%;padding:14px;border-radius:14px;border:2px dashed var(--line);color:var(--sub);font-weight:600;margin-top:12px}
.vacio{text-align:center;color:var(--sub);padding:40px 20px}

/* Resumen */
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;margin-top:8px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--bg);color:var(--ink)}
.tarjetas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tj{background:var(--card);border-radius:16px;padding:14px}
.tj .k{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center}
.tj .v{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.tj .d{font-size:13px;color:var(--sub);margin-top:2px}
.tj.ancha{grid-column:1/-1}
.barras{background:var(--card);border-radius:16px;padding:14px;margin-top:12px}
.barras .fila{display:grid;grid-template-columns:44px 1fr 52px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.barras .pista{height:14px;border-radius:7px;background:var(--bg);display:flex;overflow:hidden}
.barras .pista i{display:block;height:100%}
.barras .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--sub)}
.ley{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.sem{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.sem th{color:var(--sub);font-weight:600;text-align:right;padding:6px 4px}
table.sem td{text-align:right;padding:8px 4px;border-top:1px solid var(--line)}
table.sem th:first-child,table.sem td:first-child{text-align:left}
.tabla{background:var(--card);border-radius:16px;padding:8px 10px;margin-top:12px;overflow-x:auto}
.informe{background:var(--card);border-radius:16px;padding:14px;margin-top:12px}
.informe .fila{display:flex;gap:8px;margin-top:10px}
.btn{padding:14px 16px;border-radius:14px;font-weight:700;background:var(--ink);color:var(--bg);width:100%;text-align:center;display:block;text-decoration:none}
.btn.sec{background:var(--bg);color:var(--ink)}
.btn.peligro{background:transparent;color:var(--err)}

/* Pestañas */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub);padding:6px}
nav.tabs button .e{font-size:22px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on .e{filter:none;opacity:1}

/* Hoja inferior (formularios) */
.fondo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.fondo.on{display:flex}
.hoja{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.hoja h3{margin:0 0 14px;font-size:19px}
.campo{margin-bottom:14px}
.campo > label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:12px;background:var(--bg);font-weight:600;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg)}
.ml{display:flex;align-items:center;gap:10px}
.ml button{width:52px;height:52px;border-radius:14px;background:var(--bg);font-size:24px;font-weight:700;flex:none}
.ml input{text-align:center;font-size:26px;font-weight:700;padding:8px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pie{display:grid;gap:8px;margin-top:6px}

/* Aviso */
#toast{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast.arriba{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
#toast .t{background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;
  max-width:520px;width:100%;pointer-events:auto;box-shadow:0 6px 24px rgba(0,0,0,.2);animation:sube .15s ease-out}
#toast .t span{flex:1}
#toast .t button{color:var(--bg);font-weight:700;text-decoration:underline;padding:4px}
.cargando{text-align:center;color:var(--sub);padding:50px 0}
#vistaInforme{display:none;position:fixed;inset:0;z-index:40;background:#fff;overflow:auto;-webkit-overflow-scrolling:touch}
#vistaInforme.on{display:block}
#vistaInforme .barraInf{display:grid;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 16px 4px;background:#fff}
#vistaInforme .barraInf .btn{background:#2a2521;color:#fff}#vistaInforme .barraInf .btn.sec{background:#f2efe9;color:#2a2521}
#vistaInforme .inf{overflow-x:auto}
#vistaInforme .inf table{min-width:700px}
@media print{
  body.imprimiendo > *:not(#vistaInforme){display:none !important}
  body.imprimiendo{padding:0;background:#fff}
  #vistaInforme{position:static;overflow:visible}
  #vistaInforme .barraInf{display:none}
  #vistaInforme .inf table{min-width:0}
}
</style>
</head>
<body>
<header>
  <div class="titulo">
    <h1 id="tNombre">Tommy App</h1>

      <div class="fila">
        <select id="selRango" style="flex:1">

<nav class="tabs" id="tabs">

</nav>

<div class="fondo" id="fondo"><div class="hoja" id="hoja"></div></div>
<div id="toast"></div>
<div id="vistaInforme"></div>

<script>
/* Tommy App — almacenamiento solo en este teléfono (reemplaza al servidor) */
window.TOMMY_LOCAL = true;
(function(){
  var KR='tommy_registros', KC='tommy_config';
  function leer(){ var v=localStorage.getItem(KR); return v ? JSON.parse(v) : []; }
  function escribir(a){ localStorage.setItem(KR, JSON.stringify(a)); }
  function cfg(){ var v=localStorage.getItem(KC); return v ? JSON.parse(v) : {nombre:'Tommy', nacimiento:''}; }
  var f = {
    cargar: function(){ return {config:cfg(), registros:leer()}; },
    guardarRegistro: function(r){
      var a=leer(); r.actualizado=new Date().toISOString();
      var i=a.findIndex(function(x){ return x.id===r.id; });
      if (i>=0) a[i]=r; else a.push(r);
      escribir(a); return r.actualizado;
    },
    borrarRegistro: function(id){ escribir(leer().filter(function(x){ return x.id!==id; })); return true; },
    guardarConfig: function(c){ var o={nombre:String(c.nombre||'').slice(0,60), nacimiento:String(c.nacimiento||'').slice(0,10)}; localStorage.setItem(KC, JSON.stringify(o)); return o; },
    importar: function(d){
      var a=leer(), m={}; a.forEach(function(x,i){ m[x.id]=i; }); var n=0;
      d.registros.forEach(function(r){
        if (!r || !r.id || !r.inicio) return;
        var i=m[r.id];
        if (i===undefined){ m[r.id]=a.length; a.push(r); n++; }
        else if (String(r.actualizado||'') > String(a[i].actualizado||'')){ a[i]=r; n++; }
      });
      escribir(a);
      if (d.config && d.config.nombre) f.guardarConfig(d.config);
      return n;
    }
  };
  function corredor(ok, mal){
    var r = {
      withSuccessHandler: function(fn){ return corredor(fn, mal); },
      withFailureHandler: function(fn){ return corredor(ok, fn); }
    };
    Object.keys(f).forEach(function(k){
      r[k] = function(){
        var args = arguments;
        setTimeout(function(){
          var v; try { v = f[k].apply(null, args); } catch(e){ if (mal) mal(e); return; }
          if (ok) ok(v);
        }, 0);
      };
    });
    return r;
  }
  window.google = {script:{run: corredor(null, null)}};
})();
</script>
<script>
/* ============ Datos y configuración ============ */
var LOCAL = !!window.TOMMY_LOCAL; // true = datos solo en este teléfono
var TIPOS = {
  pecho_izq: {tipo:'comida', icono:'🤱', nombre:'Pecho izquierdo', corto:'Pecho izq.', reloj:true},
  pecho_der: {tipo:'comida', icono:'🤱', nombre:'Pecho derecho',  corto:'Pecho der.', reloj:true},
  mamadera:  {tipo:'comida', icono:'🍼', nombre:'Mamadera', corto:'Mamadera'},
  solido:    {tipo:'comida', icono:'🥣', nombre:'Sólidos', corto:'Sólidos'},
  siesta:    {tipo:'sueno',  icono:'😴', nombre:'Siesta', corto:'Siesta', reloj:true},
  noche:     {tipo:'sueno',  icono:'🌙', nombre:'Sueño nocturno', corto:'Noche', reloj:true},
  pipi:      {tipo:'panal',  icono:'💧', nombre:'Pañal: pipí', corto:'Pipí'},
  caca:      {tipo:'panal',  icono:'💩', nombre:'Pañal: caca', corto:'Caca'},
  ambos:     {tipo:'panal',  icono:'🧷', nombre:'Pañal: pipí y caca', corto:'Pipí y caca'},
  nota:      {tipo:'nota',   icono:'📝', nombre:'Nota', corto:'Nota'}
};
var SUBS_DE = {
  comida:['pecho_izq','pecho_der','mamadera','solido'],
  sueno:['siesta','noche'], panal:['pipi','caca','ambos'], nota:['nota']
};
var COLS = ['id','tipo','subtipo','inicio','fin','cantidad','detalle','nota','autor'];
var DIAS_CARGA = 31;
var MIN = 60000, HORA = 3600000, DIA = 86400000;

var S = { servidor:[], regs:[], config:{nombre:'',nacimiento:''}, pendientes:[], cargado:false,
          gen:0, modoResumen:'hoy', ultimoError:false };

/* ============ Almacenamiento local (con respaldo en memoria) ============ */
var memoria = {};
function lsGet(k){ try{ var v = localStorage.getItem(k); return v===null ? memoria[k] : v; }catch(e){ return memoria[k]; } }
function lsSet(k,v){ memoria[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }

function autor(){ return LOCAL ? '' : (lsGet('bit_autor') || ''); }
function necesitaInicio(){ return LOCAL ? !lsGet('bit_iniciado') : !autor(); }

/* ============ Utilidades ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function ahora(){ return Date.now(); }
function iso(ms){ return new Date(ms).toISOString(); }
function hhmm(ms){ var d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function pad(n){ return (n<10?'0':'')+n; }
function inicioDia(ms){ var d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function claveDia(ms){ var d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function sumarDias(ms,n){ var d=new Date(ms); d.setDate(d.getDate()+n); return d.getTime(); }
var DSEM = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
var DSEMC = ['dom','lun','mar','mié','jue','vie','sáb'];
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function etiquetaDia(ms){
  var h = inicioDia(ahora()), d = inicioDia(ms);
  if (d===h) return 'Hoy';
  if (d===sumarDias(h,-1)) return 'Ayer';
  var x=new Date(ms); return DSEM[x.getDay()]+' '+x.getDate()+' '+MESES[x.getMonth()];
}
function diaCorto(ms){ var x=new Date(ms); return DSEMC[x.getDay()]+' '+x.getDate(); }
function dur(ms){
  ms = Math.max(0,ms); var m = Math.round(ms/MIN);
  if (m < 60) return m+' min';
  var h = Math.floor(m/60), r = m%60;
  return h+' h'+(r? ' '+r+' min':'');
}
function durCorta(ms){ ms=Math.max(0,ms); var m=Math.round(ms/MIN); var h=Math.floor(m/60), r=m%60; return h? h+'h'+(r?pad(r):'') : r+'m'; }
function reloj(ms){
  ms=Math.max(0,ms); var s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+':'+pad(m) : m)+':'+pad(x);
}
function lapso(ms){ var m=Math.floor(Math.max(0,ms)/MIN); if(m<1) return 'recién'; if(m<60) return m+' min'; var h=Math.floor(m/60), r=m%60; return h<24 ? h+' h'+(r?' '+r:'') : Math.floor(h/24)+' d'; }
function hace(ms){
  var m = Math.floor((ahora()-ms)/MIN);
  if (m < 1) return 'recién';
  if (m < 60) return 'hace '+m+' min';
  var h=Math.floor(m/60), r=m%60;
  if (h < 24) return 'hace '+h+' h'+(r? ' '+r+' m':'');
  return 'hace '+Math.floor(h/24)+' d';
}
function aInput(ms){ var d=new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function deInput(v){ if(!v) return null; var p=v.split(/[-T:]/).map(Number); return new Date(p[0],p[1]-1,p[2],p[3]||0,p[4]||0).getTime(); }
function edad(fecha){
  if(!fecha) return '';
  var p=fecha.split('-').map(Number); var n=new Date(p[0],p[1]-1,p[2]); var h=new Date(); h.setHours(0,0,0,0);
  if (isNaN(n) || n>h) return '';
  var meses=(h.getFullYear()-n.getFullYear())*12+(h.getMonth()-n.getMonth());
  var ref=new Date(n); ref.setMonth(n.getMonth()+meses);
  if (ref>h){ meses--; ref=new Date(n); ref.setMonth(n.getMonth()+meses); }
  var dias=Math.round((h-ref)/DIA);
  if (meses<=0) return dias+(dias===1?' día':' días');
  var s = meses+(meses===1?' mes':' meses');
  return dias? s+' y '+dias+(dias===1?' día':' días') : s;
}

/* ============ Servidor ============ */
function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(ok,mal){
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(mal);
    r[fn].apply(r,args);
  });
}

function norm(r){
  var o={}; for (var k in r) o[k]=r[k];
  o.t0 = Date.parse(o.inicio);
  o.t1 = o.fin ? Date.parse(o.fin) : null;
  o.cant = parseFloat(o.cantidad) || 0;
  return o;
}
function enCurso(r){ return TIPOS[r.subtipo] && TIPOS[r.subtipo].reloj && !r.fin; }
function fin(r){ return r.t1 || ahora(); }

function combinar(){
  var m = {}; S.servidor.forEach(function(r){ m[r.id]=r; });
  S.pendientes.forEach(function(op){ if(op.op==='guardar') m[op.reg.id]=op.reg; else delete m[op.id]; });
  S.regs = Object.keys(m).map(function(k){ return norm(m[k]); }).filter(function(r){ return !isNaN(r.t0); })
    .sort(function(a,b){ return (b.t0-a.t0) || (b.id>a.id?1:(b.id<a.id?-1:0)); });
}

function cargar(){
  var gen = S.gen;
  return api('cargar', DIAS_CARGA).then(function(d){
    if (gen !== S.gen) return; // hubo una escritura mientras tanto; se recarga en el próximo ciclo
    S.servidor = d.registros || [];
    S.config = d.config || S.config;
    S.cargado = true; S.ultimoError = false;
    combinar(); render();
  }).catch(function(){ S.ultimoError = true; pintarEstado(); });
}

function guardarPendientes(){ lsSet('bit_pend', JSON.stringify(S.pendientes)); }
function limpio(reg){ var o={}; COLS.forEach(function(c){ o[c] = reg[c]==null ? '' : String(reg[c]); }); return o; }

function encolar(op){
  S.pendientes.push(op); guardarPendientes();
  combinar(); render(); procesar();
}
var procesando=false;
function procesar(){
  if (procesando || !S.pendientes.length) { pintarEstado(); return; }
  procesando = true; pintarEstado();
  var op = S.pendientes[0];
  var p = op.op==='guardar' ? api('guardarRegistro', limpio(op.reg)) : api('borrarRegistro', op.id);
  p.then(function(){
    S.gen++;
    if (op.op==='guardar'){
      var i = S.servidor.findIndex(function(r){ return r.id===op.reg.id; });
      var l = limpio(op.reg); if (i>=0) S.servidor[i]=l; else S.servidor.push(l);
    } else {
      S.servidor = S.servidor.filter(function(r){ return r.id!==op.id; });
    }
    S.pendientes.shift(); guardarPendientes();
    S.ultimoError=false; procesando=false; combinar(); render();
    if (S.pendientes.length) procesar(); else { pintarEstado(); cargar(); }
  }).catch(function(){
    S.ultimoError=true; procesando=false; pintarEstado();
    setTimeout(procesar, 6000);
  });
}

function guardarReg(reg){ var c=limpio(reg); c.autor = c.autor || autor(); encolar({op:'guardar', reg:c}); }
function borrarReg(id){ encolar({op:'borrar', id:id}); }

function pintarEstado(){
  var e=document.getElementById('estado');
  if (LOCAL){ e.style.display = S.ultimoError ? '' : 'none'; e.className='estado err'; e.title='No se pudo guardar en el teléfono'; return; }
  e.className = 'estado ' + (S.ultimoError ? 'err' : (S.pendientes.length ? 'pend' : (S.cargado?'ok':'')));
  e.title = S.ultimoError ? 'Sin conexión: se guardará al volver la señal' : (S.pendientes.length ? 'Guardando…' : 'Sincronizado');
}

/* ============ Acciones rápidas ============ */
function corriendo(tipo){ return S.regs.filter(function(r){ return r.tipo===tipo && enCurso(r); }); }
function nuevoReg(sub, extra){
  var t = ahora(), def = TIPOS[sub];
  var r = {id:uid(), tipo:def.tipo, subtipo:sub, inicio:iso(t), fin: def.reloj ? '' : iso(t),
           cantidad:'', detalle:'', nota:'', autor:autor()};
  if (extra) for (var k in extra) r[k]=extra[k];
  return r;
}
function iniciarPecho(sub){
  var act = corriendo('comida');
  var t = ahora();
  act.forEach(function(r){ var c=limpio(r); c.fin=iso(t); guardarReg(c); });
  var n = nuevoReg(sub); guardarReg(n);
  aviso(TIPOS[sub].nombre+': reloj iniciado', 'Deshacer', function(){ borrarReg(n.id); act.forEach(function(r){ var c=limpio(r); c.fin=''; guardarReg(c); }); });
}
function terminar(id){
  var r = S.regs.find(function(x){ return x.id===id; }); if(!r) return;
  var c = limpio(r); c.fin = iso(ahora()); guardarReg(c);
  aviso(TIPOS[r.subtipo].corto+': '+dur(ahora()-r.t0), 'Deshacer', function(){ var d=limpio(c); d.fin=''; guardarReg(d); });
}
function cambiarLado(id){
  var r = S.regs.find(function(x){ return x.id===id; }); if(!r) return;
  iniciarPecho(r.subtipo==='pecho_izq' ? 'pecho_der' : 'pecho_izq');
}
function esHoraNoche(ms){ var h=new Date(ms).getHours(); return h>=19 || h<7; }
function dormir(){
  if (corriendo('sueno').length) return;
  var n = nuevoReg(esHoraNoche(ahora()) ? 'noche' : 'siesta'); guardarReg(n);
  aviso('Se durmió '+hhmm(ahora()), 'Deshacer', function(){ borrarReg(n.id); });
}
function alternarSueno(id){
  var r = S.regs.find(function(x){ return x.id===id; }); if(!r) return;
  var c = limpio(r); c.subtipo = r.subtipo==='noche' ? 'siesta' : 'noche'; guardarReg(c);
}
function panal(sub){
  var n = nuevoReg(sub); guardarReg(n);
  aviso(TIPOS[sub].nombre+' · '+hhmm(ahora()), sub==='pipi' ? 'Deshacer' : 'Detalle', sub==='pipi'
    ? function(){ borrarReg(n.id); }
    : function(){ abrirForm(S.regs.find(function(x){return x.id===n.id;}) || norm(n)); });
}
function sugerenciaLado(){
  var p = S.regs.find(function(r){ return r.subtipo==='pecho_izq' || r.subtipo==='pecho_der'; });
  if (!p) return null;
  return p.subtipo==='pecho_izq' ? 'pecho_der' : 'pecho_izq';
}

  // En curso
  var html = '';
  S.regs.filter(enCurso).sort(function(a,b){return a.t0-b.t0;}).forEach(function(r){
    var d = TIPOS[r.subtipo];

    } else {
      html += '<div class="curso sueno"><div class="que">'+d.icono+' Durmiendo · '+(r.subtipo==='noche'?'noche':'siesta')+'</div>'+
        '<div class="desde">desde '+hhmm(r.t0)+'</div>'+
        '<div class="reloj" data-desde="'+r.t0+'">'+reloj(ahora()-r.t0)+'</div>'+
        '<div class="acciones"><button data-alt="'+r.id+'">'+(r.subtipo==='noche'?'Es siesta':'Es noche')+'</button>'+

    }
  });
  document.getElementById('enCurso').innerHTML = html;

  // Último de cada cosa
  var com = S.regs.find(function(r){ return r.tipo==='comida'; });
  var sue = S.regs.find(function(r){ return r.tipo==='sueno'; });
  var pan = S.regs.find(function(r){ return r.tipo==='panal'; });
  var u = '';
  u += cajaUlt('Comió', com ? lapso(ahora()-com.t0) : '—', com ? TIPOS[com.subtipo].corto+(com.cant? ' '+com.cant+' ml':'') : 'sin registros', 'comida');
  if (sue && enCurso(sue)) u += cajaUlt('Durmiendo', lapso(ahora()-sue.t0), 'desde '+hhmm(sue.t0), 'sueno');
  else u += cajaUlt('Despierta', sue ? lapso(ahora()-fin(sue)) : '—', sue ? 'desde '+hhmm(fin(sue)) : 'sin registros', 'sueno');
  u += cajaUlt('Pañal', pan ? lapso(ahora()-pan.t0) : '—', pan ? TIPOS[pan.subtipo].corto : 'sin registros', 'panal');
  document.getElementById('ultimos').innerHTML = u;

  // Lado sugerido
  var sug = sugerenciaLado(), comiendo = corriendo('comida');
  document.querySelectorAll('[data-pecho]').forEach(function(b){
    var es = b.getAttribute('data-pecho')===sug && !comiendo.length;
    b.classList.toggle('sug', es);
    var t = b.querySelector('.tag'); if (t) t.remove();
    if (es){ var s=document.createElement('span'); s.className='tag'; s.textContent='Le toca'; b.appendChild(s); }
  });

  // Botón sueño
  var dur0 = corriendo('sueno');
  document.getElementById('botonSueno').innerHTML = dur0.length
    ? '<button class="big sueno-b" data-terminar="'+dur0[0].id+'" style="width:100%"><span class="em">☀️</span><span>Despertó<br><small>Detiene el reloj</small></span></button>'
    : '<button class="big sueno-b" id="btnDormir" style="width:100%"><span class="em">😴</span><span>Se durmió<br><small>Inicia reloj · '+(esHoraNoche(ahora())?'cuenta como noche':'cuenta como siesta')+'</small></span></button>';
}
function cajaUlt(k,v,d,c){
  return '<div class="ult"><div class="k">'+esc(k)+'</div><div class="v" style="color:var(--'+c+')">'+esc(v)+'</div><div class="d">'+esc(d)+'</div></div>';
}

function detalleTexto(r){
  var p = [];
  if (TIPOS[r.subtipo].reloj) p.push(enCurso(r) ? 'en curso · '+dur(ahora()-r.t0) : dur(r.t1-r.t0));
  if (r.cant) p.push(r.cant+' ml');
  if (r.detalle) p.push(r.detalle);
  if (r.nota) p.push(r.nota);
  if (r.autor) p.push('por '+r.autor);
  return p.join(' · ');
}
var limiteHist = 150;
function pintarHistorial(){
  var cont = document.getElementById('listaHist');
  if (!S.cargado && !S.regs.length){ cont.innerHTML='<div class="cargando">Cargando…</div>'; return; }
  if (!S.regs.length){ cont.innerHTML='<div class="vacio">Todavía no hay registros.<br>Usa los botones de Inicio.</div>'; return; }

    var hr = d.reloj ? hhmm(r.t0)+'<br>'+(vivo?'ahora':hhmm(r.t1)) : hhmm(r.t0);
    html+='<button class="item'+(vivo?' vivo':'')+'" data-edit="'+esc(r.id)+'"><div class="ic '+r.tipo+'">'+d.icono+'</div>'+

  });
  if (diaAct!==null) html+='</div>';
  if (S.regs.length>limiteHist) html+='<button class="agregar" id="btnMas">Ver más</button>';
  cont.innerHTML = html;
}

/* ============ Cálculos de resumen ============ */
function solapado(a0,a1,b0,b1){ return Math.max(0, Math.min(a1,b1)-Math.max(a0,b0)); }
function claveNoche(ms){ var d=new Date(ms); if (d.getHours()<12) d.setDate(d.getDate()-1); d.setHours(0,0,0,0); return d.getTime(); }

function contarDia(d0){
  var d1 = sumarDias(d0,1), c={tomas:0, pechoMs:0, pechoIzq:0, pechoDer:0, ml:0, mamaderas:0, solidos:0,
    siestaMs:0, siestas:0, nocheMs:0, nocheTramos:0, pipi:0, caca:0, panales:0};
  S.regs.forEach(function(r){
    var e = fin(r);
    if (r.tipo==='comida' && r.t0>=d0 && r.t0<d1){
      c.tomas++;
      if (r.subtipo==='pecho_izq'||r.subtipo==='pecho_der'){ c.pechoMs += e-r.t0; if(r.subtipo==='pecho_izq')c.pechoIzq++; else c.pechoDer++; }
      if (r.subtipo==='mamadera'){ c.ml += r.cant; c.mamaderas++; }
      if (r.subtipo==='solido') c.solidos++;
    }
    if (r.subtipo==='siesta'){ var s=solapado(r.t0,e,d0,d1); if(s>0){ c.siestaMs+=s; if(r.t0>=d0&&r.t0<d1) c.siestas++; } }
    if (r.subtipo==='noche' && claveNoche(r.t0)===d0){ c.nocheMs += e-r.t0; c.nocheTramos++; }
    if (r.tipo==='panal' && r.t0>=d0 && r.t0<d1){
      c.panales++;
      if (r.subtipo!=='caca') c.pipi++;
      if (r.subtipo!=='pipi') c.caca++;
    }
  });
  c.despertares = Math.max(0, c.nocheTramos-1);
  return c;
}

function pintarResumen(){
  var cont=document.getElementById('contResumen');
  document.querySelectorAll('#segResumen button').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-m')===S.modoResumen); });
  if (!S.regs.length){ cont.innerHTML='<div class="vacio">Aquí aparecerán los totales cuando haya registros.</div>'; return; }
  var hoy = inicioDia(ahora());
  if (S.modoResumen==='hoy'){
    var c = contarDia(hoy), n = contarDia(sumarDias(hoy,-1));
    cont.innerHTML =
      '<div class="tarjetas">'+
      tj('🍽️ Tomas', c.tomas, (c.pechoIzq+c.pechoDer)+' pecho · '+c.mamaderas+' mamadera'+(c.solidos?' · '+c.solidos+' sólidos':''))+
      tj('🍼 Mamadera', c.ml+' ml', c.mamaderas? 'en '+c.mamaderas+' tomas':'sin mamaderas')+
      tj('🤱 Pecho', dur(c.pechoMs), 'izq. '+c.pechoIzq+' · der. '+c.pechoDer)+
      tj('😴 Siestas', dur(c.siestaMs), c.siestas+(c.siestas===1?' siesta':' siestas'))+
      tj('🌙 Anoche', n.nocheTramos? dur(n.nocheMs) : '—', n.nocheTramos? n.despertares+(n.despertares===1?' despertar':' despertares') : 'sin registro', '')+
      tj('🧷 Pañales', c.panales, c.pipi+' pipí · '+c.caca+' caca')+
      '</div>';
  } else {
    var dias=[]; for (var i=6;i>=0;i--) dias.push(sumarDias(hoy,-i));
    var datos = dias.map(function(d){ return {d:d, c:contarDia(d)}; });
    var max = Math.max.apply(null, datos.map(function(x){ return x.c.siestaMs+x.c.nocheMs; }).concat([HORA]));
    var b = '<div class="barras"><b>Sueño por día</b>';
    datos.forEach(function(x){
      var t = x.c.siestaMs+x.c.nocheMs;
      b += '<div class="fila"><span>'+diaCorto(x.d)+'</span><div class="pista">'+
        '<i style="width:'+(x.c.nocheMs/max*100)+'%;background:var(--sueno)"></i>'+
        '<i style="width:'+(x.c.siestaMs/max*100)+'%;background:var(--sueno);opacity:.45"></i></div>'+
        '<span class="n">'+(t?durCorta(t):'—')+'</span></div>';
    });
    b += '<div class="ley"><span><i style="background:var(--sueno)"></i>Noche (la que empezó ese día)</span><span><i style="background:var(--sueno);opacity:.45"></i>Siestas</span></div></div>';
    var t = '<div class="tabla"><table class="sem"><tr><th>Día</th><th>Tomas</th><th>Pecho</th><th>ml</th><th>Siesta</th><th>Noche</th><th>Pañ.</th></tr>';
    datos.slice().reverse().forEach(function(x){
      var c=x.c;
      t += '<tr><td>'+diaCorto(x.d)+'</td><td>'+c.tomas+'</td><td>'+(c.pechoMs?durCorta(c.pechoMs):'—')+'</td><td>'+(c.ml||'—')+
        '</td><td>'+(c.siestaMs?durCorta(c.siestaMs):'—')+'</td><td>'+(c.nocheMs?durCorta(c.nocheMs):'—')+'</td><td>'+c.panales+'</td></tr>';
    });
    t += '</table></div>';
    var p = promedios(datos.slice(0,6)); // días completos (sin hoy)
    cont.innerHTML = '<div class="tarjetas">'+
      tj('Promedio tomas/día', p.tomas, 'últimos 6 días completos')+
      tj('Sueño total/día', p.sueno, 'noche + siestas')+
      '</div>'+b+t;
  }
}
function tj(k,v,d){ return '<div class="tj"><div class="k">'+k+'</div><div class="v">'+esc(v)+'</div><div class="d">'+esc(d)+'</div></div>'; }
function promedios(datos){
  var con = datos.filter(function(x){ return x.c.tomas || x.c.siestaMs || x.c.nocheMs || x.c.panales; });
  if (!con.length) return {tomas:'—', sueno:'—'};
  var n=con.length, st=0, ss=0;
  con.forEach(function(x){ st+=x.c.tomas; ss+=x.c.siestaMs+x.c.nocheMs; });
  return {tomas:(Math.round(st/n*10)/10).toString().replace('.',','), sueno:durCorta(ss/n)};
}

  pintarForm();
  document.getElementById('fondo').classList.add('on');
}

  h += '<h3>'+titulo+'</h3>';
  if (F.pasado){
    h += '<div class="campo"><label>¿Qué fue?</label><div class="chips">';
    ['comida','sueno','panal','nota'].forEach(function(t){

  }
  if (SUBS_DE[r.tipo].length>1 && !(F.nuevo && !F.pasado)){
    h += '<div class="campo"><label>Tipo</label><div class="chips">';
    SUBS_DE[r.tipo].forEach(function(s){ h += '<button class="chip'+(r.subtipo===s?' on':'')+'" data-fsub="'+s+'">'+TIPOS[s].icono+' '+TIPOS[s].corto+'</button>'; });
    h += '</div></div>';
  }
  if (r.subtipo==='mamadera'){
    h += '<div class="campo"><label>Cantidad (ml)</label><div class="ml"><button data-ml="-10">−</button>'+
      '<input id="fCant" type="number" inputmode="numeric" value="'+esc(r.cantidad||'')+'" placeholder="0"><button data-ml="10">+</button></div>'+
      '<div class="chips" style="margin-top:8px">'+[30,60,90,120,150,180].map(function(v){return '<button class="chip'+(String(v)===String(r.cantidad)?' on':'')+'" data-mlv="'+v+'">'+v+'</button>';}).join('')+'</div></div>';
    h += campoChips('Qué tomó', ['Fórmula','Leche materna'], r.detalle);
  }
  if (r.subtipo==='solido') h += '<div class="campo"><label>¿Qué comió?</label><input id="fDet" value="'+esc(r.detalle)+'" placeholder="Ej: puré de zapallo, 3 cucharadas"></div>';
  if (r.subtipo==='caca' || r.subtipo==='ambos') h += campoChips('Cómo era (opcional)', ['Amarilla','Café','Verde','Líquida','Pastosa','Dura'], r.detalle);
  var conReloj = d.reloj;
  h += '<div><div class="campo"><label>'+(conReloj?'Inicio':'Hora')+'</label><input id="fIni" type="datetime-local" value="'+aInput(r.t0)+'"></div>';
  if (conReloj) h += '<div class="campo"><label>Fin</label><input id="fFin" type="datetime-local" value="'+(r.t1?aInput(r.t1):'')+'"></div>';
  h += '</div>';
  if (conReloj) h += '<div style="font-size:13px;color:var(--sub);margin:-6px 0 12px">Deja "Fin" vacío si todavía está en curso.</div>';
  h += '<div class="campo"><label>'+(r.subtipo==='nota'?'Nota':'Nota (opcional)')+'</label><textarea id="fNota" placeholder="'+(r.subtipo==='nota'?'Ej: le salió un diente, vacuna de los 2 meses…':'')+'">'+esc(r.nota)+'</textarea></div>';
  h += '<div class="pie"><button class="btn" id="fGuardar">Guardar</button>';
  if (!F.nuevo) h += '<button class="btn peligro" id="fBorrar">Eliminar registro</button>';
  h += '<button class="btn sec" id="fCancelar">Cancelar</button></div>';
  document.getElementById('hoja').innerHTML = h;
}
function campoChips(label, ops, val){
  return '<div class="campo"><label>'+label+'</label><div class="chips">'+ops.map(function(o){
    return '<button class="chip'+(val===o?' on':'')+'" data-fdet="'+esc(o)+'">'+esc(o)+'</button>'; }).join('')+'</div></div>';
}
function leerForm(){
  var r=F.reg, g=function(id){ var e=document.getElementById(id); return e? e.value : null; };
  var ini = deInput(g('fIni')); if (ini) r.t0 = ini;
  if (TIPOS[r.subtipo].reloj){ var f = g('fFin'); r.t1 = f ? deInput(f) : null; } else r.t1 = r.t0;
  if (g('fCant')!==null) r.cantidad = g('fCant');
  if (g('fDet')!==null) r.detalle = g('fDet').trim();
  if (g('fNota')!==null) r.nota = g('fNota').trim();
}
function ajustarFin(){
  var r=F.reg;
  if (!TIPOS[r.subtipo].reloj) return;
  if (!r.t1 || r.t1<=r.t0){
    if (F.pasado){ r.t1 = r.t0; r.t0 = r.t0 - 30*MIN; } else r.t1 = Math.min(ahora(), r.t0+30*MIN);
  }
}
function guardarForm(){
  leerForm();
  var r=F.reg;
  if (r.t1 && r.t1 < r.t0) return aviso('El fin no puede ser antes del inicio');
  if (r.t0 > ahora()+5*MIN) return aviso('La hora de inicio está en el futuro');
  if (r.subtipo==='mamadera' && !(parseFloat(r.cantidad)>0)) return aviso('Indica los ml');
  if (r.subtipo==='nota' && !r.nota) return aviso('Escribe la nota');
  if (TIPOS[r.subtipo].reloj && !r.t1){
    var otro = S.regs.find(function(x){ return x.tipo===r.tipo && enCurso(x) && x.id!==r.id; });
    if (otro) return aviso('Ya hay un '+(r.tipo==='sueno'?'sueño':'reloj de comida')+' en curso');
  }
  r.inicio = iso(r.t0); r.fin = r.t1 ? iso(r.t1) : '';
  guardarReg(r); cerrarForm();
  aviso('Guardado');
}

/* ============ Respaldo (solo modo local) ============ */
function compartirArchivo(nombre, contenido, tipo){
  var archivo;
  try { archivo = new File([contenido], nombre, {type:tipo}); } catch(e){ archivo = null; }
  if (archivo && navigator.canShare && navigator.canShare({files:[archivo]})){
    return navigator.share({files:[archivo], title:nombre}).then(function(){ return true; })
      .catch(function(e){ return e && e.name==='AbortError' ? false : descargar(nombre, contenido, tipo); });
  }
  return Promise.resolve(descargar(nombre, contenido, tipo));
}
function descargar(nombre, contenido, tipo){
  var url = URL.createObjectURL(new Blob([contenido], {type:tipo}));
  var a = document.createElement('a'); a.href=url; a.download=nombre; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
  return true;
}
function exportarRespaldo(){
  api('cargar', 9999).then(function(d){
    var datos = JSON.stringify({app:'tommy-app', version:1, exportado:new Date().toISOString(), config:d.config, registros:d.registros});
    return compartirArchivo('Respaldo Tommy App '+claveDia(ahora())+'.json', datos, 'application/json');
  }).then(function(ok){
    if (ok){ lsSet('bit_respaldo', String(ahora())); aviso('Respaldo listo'); cerrarForm(); render(); }
  }).catch(function(){ aviso('No se pudo crear el respaldo'); });
}
function importarRespaldo(ev){
  var f = ev.target.files && ev.target.files[0]; if (!f) return;
  var lector = new FileReader();
  lector.onload = function(){
    var d; try { d = JSON.parse(lector.result); } catch(e){ return aviso('Ese archivo no es un respaldo válido'); }
    if (!d || d.app!=='tommy-app' || !Array.isArray(d.registros)) return aviso('Ese archivo no es un respaldo de Tommy App');
    api('importar', d).then(function(n){ cerrarForm(); return cargar().then(function(){ aviso('Respaldo restaurado: '+n+' registros'); }); })
      .catch(function(){ aviso('No se pudo restaurar el respaldo'); });
  };
  lector.readAsText(f);
}
function pintarAvisoRespaldo(){
  var el = document.getElementById('avisoRespaldo'); if (!el) return;
  if (!LOCAL || S.regs.length < 30){ el.innerHTML=''; return; }
  var u = Number(lsGet('bit_respaldo')||0), dias = Math.floor((ahora()-(u||0))/DIA);
  el.innerHTML = (!u || dias>=14)
    ? '<button class="agregar" id="btnIrRespaldo" style="margin-top:22px">💾 '+(u? 'Hace '+dias+' días que no guardas un respaldo' : 'Aún no guardas ningún respaldo')+' · Guardar ahora</button>'
    : '';
}

/* ============ Informe PDF ============ */
function cuerpoInforme(nd){
  var hoy = inicioDia(ahora()), dias=[];
  for (var i=nd-1;i>=0;i--) dias.push(sumarDias(hoy,-i));
  var datos = dias.map(function(d){ return {d:d, c:contarDia(d)}; });
  while (datos.length>1 && !datos[0].c.tomas && !datos[0].c.panales && !datos[0].c.siestaMs && !datos[0].c.nocheMs) datos.shift();
  dias = datos.map(function(x){ return x.d; });
  var p = promedios(datos.slice(0,-1).length ? datos.slice(0,-1) : datos);
  var nombre = S.config.nombre || 'Tommy';
  var x = new Date(dias[0]), y = new Date(hoy);
  var per = x.getDate()+' '+MESES[x.getMonth()]+' – '+y.getDate()+' '+MESES[y.getMonth()]+' '+y.getFullYear();
  var h = '<div class="inf">'+
    '<h1>Informe de '+esc(nombre)+'</h1><div class="s">Tommy App · '+(S.config.nacimiento? 'Edad: '+esc(edad(S.config.nacimiento))+' · ':'')+'Período: '+per+'</div>'+
    '<h2>Promedios por día</h2><div><span class="k">Tomas<b>'+p.tomas+'</b></span><span class="k">Sueño total<b>'+p.sueno+'</b></span>'+
    '<span class="k">Mamadera<b>'+promML(datos)+'</b></span><span class="k">Pañales<b>'+promPan(datos)+'</b></span></div>'+
    '<h2>Detalle por día</h2><table><tr><th>Día</th><th>Tomas</th><th>Pecho (izq/der)</th><th>Tiempo pecho</th><th>Mamadera</th><th>Sólidos</th><th>Siestas</th><th>Noche</th><th>Despertares</th><th>Pipí</th><th>Caca</th></tr>';
  datos.slice().reverse().forEach(function(z){
    var c=z.c, dd=new Date(z.d);
    h += '<tr><td>'+DSEMC[dd.getDay()]+' '+dd.getDate()+' '+MESES[dd.getMonth()]+'</td><td>'+c.tomas+'</td><td>'+c.pechoIzq+' / '+c.pechoDer+'</td><td>'+(c.pechoMs?dur(c.pechoMs):'—')+
      '</td><td>'+(c.ml? c.ml+' ml':'—')+'</td><td>'+(c.solidos||'—')+'</td><td>'+(c.siestaMs? dur(c.siestaMs)+' ('+c.siestas+')':'—')+'</td><td>'+(c.nocheMs?dur(c.nocheMs):'—')+
      '</td><td>'+(c.nocheTramos? c.despertares:'—')+'</td><td>'+c.pipi+'</td><td>'+c.caca+'</td></tr>';
  });
  h += '</table><div class="s" style="margin-top:6px">"Noche" corresponde a la noche que comenzó ese día.</div>';
  var notas = S.regs.filter(function(r){ return r.nota && r.t0>=dias[0]; }).sort(function(a,b){return a.t0-b.t0;});
  if (notas.length){
    h += '<h2>Notas</h2><table>';
    notas.forEach(function(r){ var d=new Date(r.t0);
      h += '<tr><td style="width:90px">'+d.getDate()+' '+MESES[d.getMonth()]+' '+hhmm(r.t0)+'</td><td style="text-align:left">'+esc(TIPOS[r.subtipo].corto)+': '+esc(r.nota)+'</td></tr>'; });
    h += '</table>';
  }
  h += '<div class="s" style="margin-top:20px">Generado el '+new Date().toLocaleString('es-CL')+'</div></div>';
  return h;
}
var CSS_INF = '.inf{font-family:Arial,Helvetica,sans-serif;color:#222;background:#fff;font-size:11px;padding:24px}'+
  '.inf h1{font-size:20px;margin:0}.inf h2{font-size:13px;margin:18px 0 6px;color:#555;text-transform:uppercase;letter-spacing:1px}'+
  '.inf .s{color:#666;margin-top:3px}.inf table{width:100%;border-collapse:collapse;font-size:11px}.inf th,.inf td{padding:5px 6px;border-bottom:1px solid #ddd;text-align:right}'+
  '.inf th{background:#f2efe9;font-size:10px}.inf td:first-child{white-space:nowrap}.inf th:first-child,.inf td:first-child{text-align:left}.inf .k{display:inline-block;margin-right:24px}.inf .k b{font-size:16px;display:block}';
function htmlInforme(nd){
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}'+CSS_INF+'</style></head><body>'+cuerpoInforme(nd)+'</body></html>';
}
function abrirInformeLocal(nd){
  var v = document.getElementById('vistaInforme');
  v.innerHTML = '<style>'+CSS_INF+'</style><div class="barraInf"><button class="btn" id="infImprimir">🖨️ Imprimir o guardar PDF</button>'+
    '<button class="btn sec" id="infCompartir">Compartir</button><button class="btn sec" id="infCerrar">Cerrar</button></div>'+cuerpoInforme(nd);
  v.setAttribute('data-nd', nd);
  v.classList.add('on'); document.body.classList.add('imprimiendo'); window.scrollTo(0,0);
}
function cerrarInformeLocal(){ var v=document.getElementById('vistaInforme'); v.classList.remove('on'); v.innerHTML=''; document.body.classList.remove('imprimiendo'); }
function promML(datos){ var c=datos.filter(function(x){return x.c.mamaderas;}); if(!c.length) return '—'; var s=0; c.forEach(function(x){s+=x.c.ml;}); return Math.round(s/c.length)+' ml'; }
function promPan(datos){ var c=datos.filter(function(x){return x.c.panales;}); if(!c.length) return '—'; var s=0; c.forEach(function(x){s+=x.c.panales;}); return (Math.round(s/c.length*10)/10).toString().replace('.',','); }
function crearInforme(){
  var nd = Number(document.getElementById('selRango').value)||14;
  if (LOCAL) return abrirInformeLocal(nd);
  var b = document.getElementById('btnInforme'), l = document.getElementById('linkInforme');
  b.disabled = true; b.textContent = 'Creando PDF…'; l.innerHTML='';
  var nom = 'Informe '+(S.config.nombre||'guagua')+' '+claveDia(ahora());
  api('generarInforme', htmlInforme(nd), nom).then(function(url){
    l.innerHTML = '<a class="btn sec" style="margin-top:8px" target="_blank" href="'+esc(url)+'">📄 Abrir el PDF</a>';
  }).catch(function(e){ aviso('No se pudo crear el PDF: '+((e&&e.message)||'sin conexión')); })
    .then(function(){ b.disabled=false; b.textContent='Crear PDF'; });
}

/* ============ Aviso con acción ============ */
var tAviso=null;
function aviso(txt, acc, fn){
  var t=document.getElementById('toast');
  t.classList.toggle('arriba', document.getElementById('fondo').classList.contains('on'));
  t.innerHTML = '<div class="t"><span>'+esc(txt)+'</span>'+(acc?'<button id="tAcc">'+esc(acc)+'</button>':'')+'</div>';
  if (acc) document.getElementById('tAcc').onclick = function(){ t.innerHTML=''; fn(); };
  clearTimeout(tAviso); tAviso = setTimeout(function(){ t.innerHTML=''; }, acc? 6000 : 2500);
}

/* ============ Eventos ============ */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('button, a'); if (!el) return;
  var a = function(n){ return el.getAttribute(n); };
  if (a('data-pecho')) return iniciarPecho(a('data-pecho'));
  if (a('data-terminar')) return terminar(a('data-terminar'));
  if (a('data-lado')) return cambiarLado(a('data-lado'));
  if (a('data-alt')) return alternarSueno(a('data-alt'));
  if (a('data-panal')) return panal(a('data-panal'));
  if (el.id==='btnDormir') return dormir();
  if (a('data-form')){ var r = nuevoReg(a('data-form')); return abrirForm(norm(r), true); }
  if (a('data-edit')){ var x = S.regs.find(function(r){ return r.id===a('data-edit'); }); if (x) abrirForm(x); return; }
  if (a('data-v')){
    document.querySelectorAll('.vista').forEach(function(v){ v.classList.toggle('activa', v.id===a('data-v')); });
    document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b===el); });
    window.scrollTo(0,0); return;
  }
  if (a('data-m')){ S.modoResumen=a('data-m'); return pintarResumen(); }
  if (el.id==='btnPasado'){ var p=nuevoReg('pipi'); p.subtipo='pipi'; abrirForm(norm(p), true); F.pasado=true; return pintarForm(); }
  if (el.id==='btnMas'){ limiteHist+=150; return pintarHistorial(); }
  if (el.id==='btnInforme') return crearInforme();
  if (el.id==='btnAjustes') return abrirAjustes();
  if (el.id==='aGuardar') return guardarAjustes();
  if (el.id==='aExportar') return exportarRespaldo();
  if (el.id==='btnIrRespaldo') return abrirAjustes();
  if (el.id==='infCerrar') return cerrarInformeLocal();
  if (el.id==='infImprimir') return window.print();
  if (el.id==='infCompartir'){ var nd=Number(document.getElementById('vistaInforme').getAttribute('data-nd'))||14;
    return compartirArchivo('Informe '+(S.config.nombre||'Tommy')+' '+claveDia(ahora())+'.html', htmlInforme(nd), 'text/html'); }
  if (!F) return;
  if (el.id==='fCancelar') return cerrarForm();
  if (el.id==='fGuardar') return guardarForm();
  if (el.id==='fBorrar'){
    var id=F.reg.id, copia=limpio(F.reg);
    if (S.regs.some(function(r){return r.id===id;})){
      borrarReg(id); cerrarForm(); aviso('Registro eliminado','Deshacer', function(){ guardarReg(copia); });
    } else cerrarForm();
    return;
  }
  if (a('data-ftipo')){ leerForm(); F.reg.tipo=a('data-ftipo'); F.reg.subtipo=SUBS_DE[F.reg.tipo][0]; F.reg.detalle=''; F.reg.cantidad='';
    ajustarFin(); return pintarForm(); }
  if (a('data-fsub')){ leerForm(); var antes=F.reg.subtipo; F.reg.subtipo=a('data-fsub');
    ajustarFin();
    if (TIPOS[F.reg.subtipo].tipo!==TIPOS[antes].tipo || F.reg.subtipo==='mamadera'||antes==='mamadera'||antes==='solido') F.reg.detalle='';
    return pintarForm(); }
  if (a('data-fdet')){ leerForm(); F.reg.detalle = F.reg.detalle===a('data-fdet') ? '' : a('data-fdet'); return pintarForm(); }
  if (a('data-mlv')){ leerForm(); F.reg.cantidad=a('data-mlv'); return pintarForm(); }
  if (a('data-ml')){ var i=document.getElementById('fCant'); i.value = Math.max(0,(parseFloat(i.value)||0)+Number(a('data-ml'))); return; }
});
document.getElementById('fondo').addEventListener('click', function(ev){ if (ev.target.id==='fondo') cerrarForm(); });

})();
